<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pimbru</title><link rel="stylesheet" href="stil.css?v=39"></head><body>
<header class="ust"><div class="ust-ic"><a class="logo" href="#" aria-label="Pimbru"><span class="marka-isaret">p</span><span id="marka">pimbru</span></a><div class="arama"><span data-icon="search"></span><input id="arama" placeholder="Pimbru'da ara" aria-label="Ara"></div><div class="ust-sag"><button class="yuvarlak mobil" id="aramaAc" aria-label="Ara" data-icon="search"></button><button class="yuvarlak" id="mesaj" aria-label="Mesajlar" data-icon="message"></button><button class="yuvarlak" id="menu" aria-label="Menü" data-icon="menu"></button></div></div></header>
<nav class="ana-nav" aria-label="Ana menü"><button data-nav="home" data-icon="home" aria-label="Ana sayfa"></button><button data-nav="friends" data-icon="users" aria-label="Arkadaşlar"></button><button data-nav="create" data-icon="plus" aria-label="Gönderi oluştur"></button><button data-nav="notifications" data-icon="bell" aria-label="Bildirimler"></button><button data-nav="profile" class="aktif" aria-label="Profil"><img id="navFoto" alt=""></button></nav>
<main class="sayfa"><section class="profil"><div id="kapak" class="kapak"></div><div class="profil-alt"><button id="profilFoto" class="avatar-buyuk" aria-label="Profil fotoğrafını görüntüle"><img id="avatar" alt="Melek Akkayalı"></button><div class="kimlik"><h1 id="ad"></h1><p id="arkadas"></p></div><div class="dugmeler"><button id="arkadasDugme" class="ana"><span data-icon="image"></span> Fotoğraflar</button><button id="profilMesaj" type="button"><span data-icon="image"></span> Fotoğraf paylaş</button><button id="profilMenu" aria-label="Diğer" data-icon="more"></button></div></div><nav class="sekme" aria-label="Profil menüsü"><button data-tab="posts" class="aktif">Gönderiler</button><button data-tab="photos">Fotoğraflar</button><button data-tab="friends">Arkadaşlar</button></nav></section>
<div class="icerik"><aside><section class="kart"><div class="kart-baslik"><h2>Fotoğraflar</h2><button class="metin-btn" data-tab="photos">Tümünü gör</button></div><div id="galeri" class="galeri"></div></section></aside><section class="akim"><div class="kart olustur-kart"><button id="createPost" type="button" class="olustur-btn"><img id="composeAvatar" src="melek-profil.jpg" alt=""><span>Bir fotoğraf paylaş...</span><span class="olustur-arti">＋</span></button><div class="olustur-alt"><button id="photoShare" type="button"><span data-icon="image"></span> Fotoğraf / video</button></div></div><div class="kart filtre"><h2 id="baslik">Gönderiler</h2><button id="filtre" class="filtre-btn"><span data-icon="filter"></span><span id="filtreYazi">Tümü</span></button></div><div id="paylasimlar"></div></section></div></main>
<dialog id="panel"><div class="panel-ust"><h2 id="panelBaslik"></h2><button id="panelKapat" aria-label="Kapat" data-icon="x"></button></div><div id="panelIcerik"></div></dialog>
<dialog id="tam" class="tam"><div class="tam-ust"><button id="tamKapat" aria-label="Fotoğrafı kapat" data-icon="x"></button><span id="tamSayac"></span><button id="tamMenu" aria-label="Fotoğraf seçenekleri" data-icon="more"></button></div><div class="tam-foto"><img id="tamFoto" alt=""></div><div class="tam-alt"><b id="tamAd"></b><small id="tamBilgi"></small><p id="tamYazi"></p><div class="tam-nav"><button id="onceki" data-icon="left" aria-label="Önceki fotoğraf"></button><button id="sonraki" data-icon="right" aria-label="Sonraki fotoğraf"></button></div></div></dialog>
<dialog id="compose" class="compose"><div class="panel-ust"><h2>Gönderi oluştur</h2><button id="composeClose" type="button" aria-label="Kapat" data-icon="x"></button></div><div class="compose-author"><img id="composeUserAvatar" src="melek-profil.jpg" alt=""><b>Melek Akkayalı</b></div><textarea id="captionText" rows="3" placeholder="Bir şeyler yaz... (isteğe bağlı)"></textarea><div id="uploadPreview" class="upload-preview" hidden><img id="selectedImage" alt="Seçilen fotoğraf"><button id="removeSelected" type="button" aria-label="Seçili fotoğrafı kaldır">×</button></div><label class="choosePhoto" for="galleryInput"><span data-icon="image"></span> Galeriden fotoğraf seç</label><input id="galleryInput" type="file" accept="image/*" hidden><button class="publish" id="publishPost" type="button" disabled>Paylaş</button><p id="composeError" class="compose-error" role="status"></p></dialog>

<script src="veri.js?v=39"></script><script src="uygulama.js?v=39"></script></body></html>
